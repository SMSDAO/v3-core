name: Lint

on:
  workflow_dispatch:  # superseded by ci.yml on push/PR

jobs:
  run-linters:
    name: Run linters
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v3

      - name: Set up node
        uses: actions/setup-node@v3
        with:
          node-version: 16
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run Solhint
        run: yarn solhint 'contracts/**/*.sol'

      - name: Run Prettier
        run: yarn prettier --check 'contracts/**/*.sol'
